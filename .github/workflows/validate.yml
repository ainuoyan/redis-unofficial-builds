name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK for Windows wrapper tests
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Test Windows wrapper configuration and endpoint safety
        run: dotnet run --project tests/windows/RedisService.Tests.csproj --configuration Release

      - name: Test Windows installation configuration generation
        shell: pwsh
        run: |
          ./tests/windows/Test-ManagedRedisConfig.ps1
          ./tests/windows/Test-ServicePolicy.ps1

      - name: Validate JSON, Python, shell, and controller behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool config/release-lines.json >/dev/null
          python3 -m json.tool config/platforms.json >/dev/null
          python3 -m py_compile scripts/release/*.py scripts/experimental/*.py packaging/linux/patches/*.py
          python3 scripts/release/validate_configs.py \
            --release-config config/release-lines.json \
            --platform-config config/platforms.json \
            --workflows-dir .github/workflows
          bash -n \
            scripts/linux/build-redis.sh \
            scripts/experimental/*.sh \
            packaging/linux/scripts/*.sh \
            packaging/musl/scripts/*.sh \
            packaging/macos/scripts/*.sh
          pwsh -NoProfile -NonInteractive -Command '
            $allErrors = @()
            Get-ChildItem packaging/windows/scripts/*.ps1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [void][Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$parseErrors)
              $allErrors += $parseErrors
            }
            if ($allErrors.Count -ne 0) { $allErrors | Out-String | Write-Error }
          '
          python3 -m unittest discover -s tests -v
